<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e17" />
  <meta name="description" content="RidgeRush - Master the Momentum. Physics-based 2D racing & stunts." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <title>RidgeRush — Master the Momentum</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #0a0e17;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #e8eef7;
      touch-action: none;
      user-select: none;
    }
    #game-container {
      position: relative;
      width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    #game-canvas {
      display: block;
      max-width: 100%; max-height: 100%;
      background: #0a0e17;
      image-rendering: pixelated;
    }
    #ui-overlay {
      position: absolute; inset: 0;
      pointer-events: none;
      z-index: 10;
    }
    #ui-overlay > * { pointer-events: auto; }
    .hidden { display: none !important; }
    #loading-screen {
      position: absolute; inset: 0;
      background: linear-gradient(160deg, #0a0e17 0%, #121a2b 50%, #0d1320 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 100;
      transition: opacity 0.5s ease;
    }
    #loading-screen .logo {
      font-size: clamp(2.5rem, 10vw, 4.5rem);
      font-weight: 900;
      letter-spacing: 0.08em;
      background: linear-gradient(135deg, #ff6b2c, #ffd166, #4ecdc4);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 40px rgba(255,107,44,0.4);
      margin-bottom: 0.4rem;
    }
    #loading-screen .tagline {
      font-size: 0.95rem; letter-spacing: 0.35em; text-transform: uppercase;
      color: #7a8ba8; margin-bottom: 2.5rem;
    }
    .progress-bar {
      width: min(280px, 70vw); height: 6px;
      background: #1a2438; border-radius: 3px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #ff6b2c, #ffd166);
      border-radius: 3px; transition: width 0.2s ease;
    }
    #loading-status { margin-top: 1rem; font-size: 0.85rem; color: #5a6b85; }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
    <div id="ui-overlay"></div>
    <div id="loading-screen">
      <div class="logo">RIDGERUSH</div>
      <div class="tagline">Master the Momentum</div>
      <div class="progress-bar"><div class="progress-fill" id="load-progress"></div></div>
      <div id="loading-status">Preparing your ride...</div>
    </div>
  </div>
  <script src="./loader.js"></script>
</body>
</html>
