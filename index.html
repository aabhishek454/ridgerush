<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a0e17">
<title>RidgeRush</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0a0e17;
    font-family: system-ui, -apple-system, sans-serif;
    color: #e8eef7;
    touch-action: manipulation;
  }
  #game {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    display: block;
    background: #87ceeb;
  }
  #ui {
    position: fixed; inset: 0;
    z-index: 100;
    pointer-events: none;
  }
  #ui * { pointer-events: auto; }
  #menu {
    position: absolute; inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #0a0e17, #121a2b);
    text-align: center;
    padding: 1rem;
  }
  .logo {
    font-size: clamp(2.4rem, 11vw, 3.6rem);
    font-weight: 900;
    letter-spacing: 0.06em;
    background: linear-gradient(135deg, #ff6b2c, #ffd166, #4ecdc4);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .tag {
    color: #7a8ba8;
    letter-spacing: 0.28em;
    font-size: 0.72rem;
    margin: 0.5rem 0 1.5rem;
    text-transform: uppercase;
  }
  button {
    width: min(270px, 86vw);
    padding: 0.95rem;
    margin: 0.4rem;
    border: 0;
    border-radius: 14px;
    font-weight: 700;
    font-size: 1.1rem;
    color: #fff;
    cursor: pointer;
    background: linear-gradient(135deg, #ff6b2c, #e55a1f);
    box-shadow: 0 6px 22px rgba(255,107,44,0.4);
  }
  button.sec {
    background: linear-gradient(135deg, #1a2438, #243050);
    border: 1px solid #2a3a55;
    box-shadow: none;
  }
  .hint {
    color: #7a8ba8;
    font-size: 0.75rem;
    margin-top: 1.2rem;
    line-height: 1.55;
  }
  #hud {
    display: none;
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 48px;
    background: rgba(10,14,23,0.88);
    align-items: center;
    padding: 0 14px;
    gap: 18px;
    font-size: 14px;
    font-weight: 700;
  }
  #padL, #padR {
    display: none;
    position: absolute;
    bottom: 0;
    width: 45%;
    height: 45%;
    opacity: 0.01;
  }
  #padL { left: 0; }
  #padR { right: 0; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div id="menu">
    <div class="logo">RIDGERUSH</div>
    <div class="tag" id="status">Master the Momentum</div>
    <button type="button" id="btnPlay">PLAY</button>
    <button type="button" class="sec" id="btnTut">TUTORIAL</button>
    <p class="hint">
      Desktop: D gas · A brake · W/S rotate · Space boost<br>
      Phone: hold right side = gas · left = brake
    </p>
  </div>
  <div id="hud">
    <span id="time">0:00</span>
    <span id="speed">0 km/h</span>
    <span id="coins">$0</span>
    <span id="fuel">100%</span>
  </div>
  <div id="padL"></div>
  <div id="padR"></div>
</div>
<script>
var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');
var menu = document.getElementById('menu');
var hud = document.getElementById('hud');
var statusEl = document.getElementById('status');
var padL = document.getElementById('padL');
var padR = document.getElementById('padR');

var W = 800, H = 600, DPR = 1;
var keys = {};
var gas = false, brake = false;
var running = false;
var pts = [];
var coins = [];
var car = { x: 100, y: 300, vx: 0, vy: 0, a: 0, w: 0, fuel: 100, money: 0, boost: 0, cd: 0 };
var camX = 0, camY = 0, camZ = 1;
var t = 0;
var last = 0;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

window.addEventListener('keydown', function(e) {
  keys[e.code] = true;
  if (e.code === 'Space') e.preventDefault();
});
window.addEventListener('keyup', function(e) {
  keys[e.code] = false;
});

function setGas(v) { gas = v; }
function setBrake(v) { brake = v; }

['touchstart','mousedown'].forEach(function(ev) {
  padL.addEventListener(ev, function(e) { e.preventDefault(); setBrake(true); }, {passive:false});
  padR.addEventListener(ev, function(e) { e.preventDefault(); setGas(true); }, {passive:false});
});
['touchend','touchcancel','mouseup','mouseleave'].forEach(function(ev) {
  padL.addEventListener(ev, function() { setBrake(false); });
  padR.addEventListener(ev, function() { setGas(false); });
});

function makeTrack(seed, length) {
  var s = seed | 0;
  function rnd() {
    s = (s * 1103515245 + 12345) & 0x7fffffff;
    return s / 0x7fffffff;
  }
  var out = [{x:0, y:380}];
  var x = 0, y = 380;
  var i;
  for (i = 0; i < 16; i++) {
    x += 24;
    y += (rnd() - 0.5) * 4;
    out.push({x:x, y:y});
  }
  var amp = 40 + rnd() * 40;
  var freq = 0.007 + rnd() * 0.004;
  var ph = rnd() * 6.28;
  while (x < length) {
    x += 18;
    var n = Math.sin(x * freq + ph) * amp + Math.sin(x * freq * 2.1) * amp * 0.35;
    var bump = 0;
    if (rnd() < 0.04) bump = -(25 + rnd() * 50);
    if (rnd() < 0.03) bump = 20 + rnd() * 35;
    y = Math.max(140, Math.min(600, 370 + n + bump));
    out.push({x:x, y:y});
  }
  for (i = 0; i < 14; i++) {
    x += 22;
    y += (370 - y) * 0.2;
    out.push({x:x, y:y});
  }
  return out;
}

function groundY(x) {
  if (!pts.length) return 400;
  if (x <= pts[0].x) return pts[0].y;
  if (x >= pts[pts.length - 1].x) return pts[pts.length - 1].y;
  var lo = 0, hi = pts.length - 1;
  while (hi - lo > 1) {
    var m = (lo + hi) >> 1;
    if (pts[m].x < x) lo = m; else hi = m;
  }
  var a = pts[lo], b = pts[hi];
  var t = (x - a.x) / ((b.x - a.x) || 1);
  return a.y + (b.y - a.y) * t;
}

function groundN(x) {
  var lo = 0, hi = pts.length - 1;
  if (x <= pts[0].x) { lo = 0; hi = 1; }
  else if (x >= pts[pts.length - 1].x) { lo = pts.length - 2; hi = pts.length - 1; }
  else {
    while (hi - lo > 1) {
      var m = (lo + hi) >> 1;
      if (pts[m].x < x) lo = m; else hi = m;
    }
  }
  var a = pts[lo], b = pts[hi];
  var nx = -(b.y - a.y), ny = b.x - a.x;
  if (ny > 0) { nx = -nx; ny = -ny; }
  var len = Math.hypot(nx, ny) || 1;
  return { x: nx / len, y: ny / len };
}

function startGame(tutorial) {
  var seed = tutorial ? 99 : ((Date.now() & 0xffff) | 1);
  var len = tutorial ? 900 : 1900;
  pts = makeTrack(seed, len);
  car.x = 100;
  car.y = groundY(100) - 40;
  car.vx = 0;
  car.vy = 0;
  car.a = 0;
  car.w = 0;
  car.fuel = 100;
  car.money = 0;
  car.boost = 0;
  car.cd = 0;
  camX = car.x - W * 0.25;
  camY = car.y - H * 0.4;
  camZ = 1;
  t = 0;
  coins = [];
  var x;
  for (x = 220; x < pts[pts.length - 1].x - 120; x += 75 + Math.random() * 45) {
    if (Math.random() < 0.72) {
      coins.push({
        x: x,
        y: groundY(x) - 30 - Math.random() * 25,
        got: false,
        isFuel: Math.random() < 0.2
      });
    }
  }
  running = true;
  menu.style.display = 'none';
  hud.style.display = 'flex';
  padL.style.display = 'block';
  padR.style.display = 'block';
  last = performance.now();
}

function endGame(won) {
  running = false;
  menu.style.display = 'flex';
  hud.style.display = 'none';
  padL.style.display = 'none';
  padR.style.display = 'none';
  if (won) {
    statusEl.textContent = 'FINISH! $' + car.money + ' in ' + t.toFixed(1) + 's';
  } else {
    statusEl.textContent = 'Crashed — try again';
  }
}

document.getElementById('btnPlay').onclick = function() { startGame(false); };
document.getElementById('btnTut').onclick = function() { startGame(true); };

function update(dt) {
  if (!running) return;
  t += dt;

  var thr = 0, air = 0;
  if (keys['KeyD'] || keys['ArrowRight'] || gas) thr = 1;
  if (keys['KeyA'] || keys['ArrowLeft'] || brake) thr = -1;
  if (keys['KeyW'] || keys['ArrowUp']) air = -1;
  if (keys['KeyS'] || keys['ArrowDown']) air = 1;
  if (keys['Space'] && car.cd <= 0 && car.fuel > 10) {
    car.boost = 1.0;
    car.cd = 3.2;
  }
  if (car.boost > 0) car.boost -= dt;
  if (car.cd > 0) car.cd -= dt;

  car.fuel = Math.max(0, car.fuel - (thr > 0 ? 3.5 : 0.35) * dt - (car.boost > 0 ? 4 * dt : 0));
  if (car.fuel <= 0) thr *= 0.15;

  var fx = 0, fy = 0, on = false;
  var wheels = [car.x - 16, car.x + 16];
  var wi;
  for (wi = 0; wi < 2; wi++) {
    var wx = wheels[wi];
    var gy = groundY(wx);
    var n = groundN(wx);
    var wy = car.y + 12 * Math.cos(car.a);
    var pen = gy - wy;
    if (pen > -12) {
      on = true;
      var spring = Math.max(0, pen + 8) * 130;
      var damp = -car.vy * 12;
      var f = spring + damp;
      fx += f * n.x;
      fy += f * n.y;
      var tx = -n.y, ty = n.x;
      if (tx * Math.cos(car.a) + ty * Math.sin(car.a) < 0) {
        tx = -tx; ty = -ty;
      }
      var drive = thr * 2600;
      if (car.boost > 0) drive += 4000;
      if (thr < 0) drive = -Math.sign(car.vx || 1) * 2000;
      fx += tx * drive * 0.02;
      fy += ty * drive * 0.02;
      var lat = car.vx * ty - car.vy * tx;
      fx += -ty * lat * 8;
      fy += tx * lat * 8;
      if (pen > 0) {
        car.y -= pen * 0.5;
        car.vy *= 0.4;
      }
    }
  }

  if (!on) {
    car.w += air * 8 * dt;
    car.fuel = Math.max(0, car.fuel - 0.15 * dt);
  }

  fy += 900;
  var sp = Math.hypot(car.vx, car.vy);
  if (sp > 3) {
    var drag = sp * sp * 0.00012;
    fx -= (car.vx / sp) * drag;
    fy -= (car.vy / sp) * drag;
  }

  car.vx = (car.vx + fx * dt) * 0.99;
  car.vy = (car.vy + fy * dt) * 0.99;
  car.w *= 0.985;
  car.a += car.w * dt;
  car.x += car.vx * dt;
  car.y += car.vy * dt;

  if (sp > 360) {
    var sc = 360 / sp;
    car.vx *= sc;
    car.vy *= sc;
  }

  var ci;
  for (ci = 0; ci < coins.length; ci++) {
    var c = coins[ci];
    if (c.got) continue;
    if (Math.hypot(c.x - car.x, c.y - car.y) < 34) {
      c.got = true;
      if (c.isFuel) car.fuel = Math.min(100, car.fuel + 22);
      else car.money += 10;
    }
  }

  if (car.x >= pts[pts.length - 1].x - 15) {
    endGame(true);
  }
  if (car.y > 950) {
    endGame(false);
  }

  camX += (car.x + car.vx * 0.15 - camX - W * 0.22) * Math.min(1, 5 * dt);
  camY += (car.y - camY - H * 0.38) * Math.min(1, 4 * dt);
  camZ = Math.max(0.55, Math.min(1.05, 1 - sp * 0.0002));

  var mm = Math.floor(t / 60);
  var ss = (t % 60) | 0;
  document.getElementById('time').textContent = mm + ':' + (ss < 10 ? '0' : '') + ss;
  document.getElementById('speed').textContent = ((Math.abs(car.vx) * 0.12) | 0) + ' km/h';
  document.getElementById('coins').textContent = '$' + car.money;
  var fe = document.getElementById('fuel');
  fe.textContent = (car.fuel | 0) + '%';
  fe.style.color = car.fuel < 20 ? '#e74c3c' : '#2ecc71';
}

function draw() {
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#5eb0d8');
  g.addColorStop(0.6, '#c5e8f7');
  g.addColorStop(1, '#eaf6fc');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  if (!pts.length) return;

  ctx.save();
  ctx.translate(W / 2, H / 2);
  ctx.scale(camZ, camZ);
  ctx.translate(-camX - W / (2 * camZ), -camY - H / (2 * camZ));

  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  var i;
  for (i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.lineTo(pts[pts.length - 1].x, pts[pts.length - 1].y + 800);
  ctx.lineTo(pts[0].x, pts[0].y + 800);
  ctx.closePath();
  ctx.fillStyle = '#2a4a26';
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.strokeStyle = '#4d8a42';
  ctx.lineWidth = 7;
  ctx.stroke();

  var fx = pts[pts.length - 1].x;
  var fy = groundY(fx);
  ctx.strokeStyle = '#4ecdc4';
  ctx.lineWidth = 3;
  ctx.strokeRect(fx - 22, fy - 80, 44, 80);
  ctx.fillStyle = '#ff6b2c';
  ctx.fillRect(fx - 26, fy - 92, 52, 14);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 11px system-ui,sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('FINISH', fx, fy - 81);

  for (i = 0; i < coins.length; i++) {
    var c = coins[i];
    if (c.got) continue;
    ctx.beginPath();
    ctx.arc(c.x, c.y, 10, 0, Math.PI * 2);
    ctx.fillStyle = c.isFuel ? '#2ecc71' : '#ffd166';
    ctx.fill();
  }

  ctx.save();
  ctx.translate(car.x, car.y);
  ctx.rotate(car.a);

  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();
  ctx.arc(0, 16, 14, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath(); ctx.arc(-16, 11, 10, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(16, 11, 10, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = '#3d8fd6';
  ctx.beginPath();
  ctx.moveTo(-24, -5);
  ctx.lineTo(-14, -15);
  ctx.lineTo(14, -15);
  ctx.lineTo(24, -3);
  ctx.lineTo(22, 9);
  ctx.lineTo(-22, 9);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = 'rgba(160,210,255,0.5)';
  ctx.fillRect(-1, -13, 14, 8);

  if (car.boost > 0) {
    ctx.fillStyle = '#ff6b2c';
    ctx.beginPath();
    ctx.moveTo(-24, 1);
    ctx.lineTo(-40 - Math.random() * 8, -5);
    ctx.lineTo(-34, 1);
    ctx.lineTo(-40 - Math.random() * 8, 8);
    ctx.closePath();
    ctx.fill();
  }

  ctx.restore();
  ctx.restore();
}

function frame(now) {
  var dt = Math.min(0.04, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
last = performance.now();
requestAnimationFrame(frame);
draw();
</script>
</body>
</html>
